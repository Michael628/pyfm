site_name: PyFM
site_description: Nanny, postprocessing, and A2A contraction scripts for lattice QCD
repo_url: https://github.com/Michael628/pyfm

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - API Reference:
    - Tasks: api/tasks.md
    - A2A: api/a2a.md
    - Nanny: api/nanny.md
    - Data I/O: api/dataio.md
    - Domain: api/domain.md
    - Core: api/core.md
