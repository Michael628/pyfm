#Parameters for LMI running
shared_params:
  home: PYFM_WORKSPACE_TOPDIR/l{ens} # Location of work directory
  mass:
    l: 0.001135
  logging_level: DEBUG
  ens: '80144f211b6436m001135m03096m3656'
  time: 144
  ext: ''
  runid: 'LMI-RW-series-{series}-{eigs}-eigs-{noise}-noise'
  lattice: [80, 80, 80, 144]

contract_params:
  hardware: "cpu"
  # logging_level: 'DEBUG'
  diagram_params:
    pion_local:
      gamma_label: pion_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "G5_G5"
      eig_range:
        min: 0
        max: 4000
      outfile: contract
    vec_local:
      gamma_label: vec_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "GX_GX"
        - "GY_GY"
        - "GZ_GZ"
      eig_range:
        min: 0
        max: 4000
      outfile: contract
    vec_onelink:
      gamma_label: vec_onelink
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "GX_G1"
        - "GY_G1"
        - "GZ_G1"
      eig_range:
        min: 0
        max: 4000
      outfile: contract

smear_params:
  space: 80
  node_geometry: "1 1 4 4"

hadrons_params:
  tstart: 0 # first source time slice
  tstop: 143
  dt: 2 # spacing between source time slices
  noise: 1 # leave this as 1
  eigs: 2000
  sourceeigs: 2000
  lanczos:
    alpha: 0.001
    beta: 24
    npoly: 251
    nstop: 2000
    nk: 2050
    nm: 2500
    residual: 1e-8 # parameter for lanczos eigensolver
  residual: 1e-8
  blocksize: 400
  overwrite: False # skip CG solves if correlator already exists

nanny:
  todo_file: todo
  # todo_file: todo_checkGhms
  max_queue: 200
  wait: 5
  check_interval: 30

submit:
  scheduler: PYFM_WORKSPACE_SCHEDULER
  job_name_pfx: LMI
  layout:
    ppn: 4
    smear:
      nodes: 4 
      geom: [1,1,4,4]
    hadrons_smear:
      nodes: 4 
      geom: [1,1,4,4]
    contract:
      ppn: 1
      nodes: 1
      geom: [1,1,1,1]
    hadrons:
      nodes: 64 
      geom: [4,4,4,4] # Product should equal nodes*ppn

# Template and I/O file name keys
job_setup:
  smear: 
    run: milc.PYFM_WORKSPACE_SCHEDULER
    job_type: smear
    tasks:
      unsmeared_file: '/pscratch/sd/m/mlynch/l96192f211b672m0008m022m260/lat/v5/l{ens}{series}.{cfg}'
      node_geometry: "2 2 4 4"
    io: links
    wall_time: "2:00:00"
  contract:
    run: contract.PYFM_WORKSPACE_SCHEDULER
    job_type: contract
    tasks:
      diagrams:
        - pion_local
        - vec_local
        - vec_onelink
    io: "contract-e{eigs}-n{noise}"
    wall_time: "8:00:00"
  hadrons_smear:
    run: hadrons.PYFM_WORKSPACE_SCHEDULER
    io: "hadrons-smear-e{eigs}-n{noise}"
    wall_time: "02:00:00"
    job_type: hadrons
    task_type: lmi
    tasks:
      gauge:
        action_type: smearv5
        save_ildg: true
  hadrons:
    run: hadrons.PYFM_WORKSPACE_SCHEDULER
    io: "lmi-e{eigs}-n{noise}"
    wall_time: "04:00:00"
    job_type: hadrons
    task_type: lmi
    tasks:
      epack:
        load: false
        save_evals: true
        save_eigs: false
      meson:
        gamma:
          - local
          - onelink
        mass:
          - "l"
      high_modes:
        gamma:
          - pion_local
          - vec_local
          - vec_onelink
        mass:
          - "l"

files:
  fat_links:
    filestem: lat/scidac/fat{ens}{series}.ildg
    good_size: 42467330464 
  long_links:
    filestem: lat/scidac/lng{ens}{series}.ildg
    good_size: 42467330464 
  v5_links:
    filestem: lat/v5/l{ens}{series}
    good_size: 42467330464 
  gauge_links:
    filestem: lat/scidac/l{ens}{series}.ildg
    good_size: 21233666544 
  eig:
    filestem: eigen/eig{ens}nv{eigs}er8_grid_{series}
    good_size: 8153732016768
  eigdir:
    filestem: eigen/eig{ens}nv{eigs}er8_grid_{series}
    good_size: 4076866904
  eval:
    filestem: eigen/eval/eval{ens}nv{eigs}{series}
    good_size: 19612 
  high_modes:
    filestem: PYFM_WORKSPACE_DATASUBDIRe{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/{dset}/corr_{gamma_label}_{dset}_m{mass}_t{tsource}_{series}
    good_size: 13600 
  meson:
    filestem: PYFM_WORKSPACE_DATASUBDIRe{eigs}n{noise}dt{dt}/mesons/m{mass}/mf_{series}
    good_size: 18432006256
  contract:
    filestem: PYFM_WORKSPACE_DATASUBDIRe{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/a2aLL/corr_{gamma_label}_a2aLL_m{mass}_{series}
    good_size: 331960 
  contract_legacy:
    filestem: PYFM_WORKSPACE_DATASUBDIRe{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/a2aLL/corr_{gamma_label}_a2aLL_m{mass}_{series}
    good_size: 331960 

