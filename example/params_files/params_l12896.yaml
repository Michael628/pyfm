# Parameters for LMI running
shared_params:
  home: PYFM_WORKSPACE_TOPDIR/l{ens} # Location of work directory
  logging_level: DEBUG
  ens: '12896f211b630m001326m03636m4313'
  lattice: [128, 128, 128, 96]
  space: 128
  time: 96
  mass:
    l: 0.001326
    h: 0.000514
  tstart: 0
  tstop: 95
  dt: 1
  noise: 1
  eigs: 8000
  sourceeigs: 8000
  lanczos:
    alpha: 0.001
    beta: 24
    npoly: 301
    nstop: 8000
    nk: 8050
    nm: 8700
    residual: 1e-8
  residual: 1e-8
  blocksize: 500
  overwrite: false
  runid: 'LMI-RW-series-{series}-{eigs}-eigs-{noise}-noise'

contract_params:
  hardware: "cpu"
  diagram_params:
    pion_local_hms:
      gamma_label: pion_local
      symmetric: True
      contraction_type: two_point
      mesons:
        - file: "meson" # Label given to location of meson field files (see 'files:' section below)
          mass_original: "l" # Mass used in creating meson field file
          mass_updated: "h" # Label for desired mass (from mass: list above)
          evalfile: 'eval' # Label given to location of eigenvalue files (see 'files:' section below)
      gammas:
        - "G5_G5"
      eig_range:
        min: 0
        max: 16000 # Equal to 2 x eigs
      outfile: contract # Label given to output files (see 'files:' section below)
    vec_local_hms:
      gamma_label: vec_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass_original: "l"
        mass_updated: "h"
        evalfile: 'eval'
      gammas:
        - "GX_GX"
        - "GY_GY"
        - "GZ_GZ"
      eig_range:
        min: 0
        max: 16000
      outfile: contract
    pion_local:
      gamma_label: pion_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "G5_G5"
      eig_range:
        min: 0
        max: 16000
      outfile: contract
    vec_local:
      gamma_label: vec_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "GX_GX"
        - "GY_GY"
        - "GZ_GZ"
      eig_range:
        min: 0
        max: 16000
      outfile: contract
    vec_onelink:
      gamma_label: vec_onelink
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "GX_G1"
        - "GY_G1"
        - "GZ_G1"
      eig_range:
        min: 0
        max: 16000
      outfile: contract

smear_params:
  node_geometry: "1 1 4 4"

nanny:
  todo_file: todo
  # todo_file: todo_checkGhms
  max_cases: 1
  max_queue: 200
  wait:     5
  check_interval: 30

submit:
  scheduler: PYFM_WORKSPACE_SCHEDULER
  # scheduler: INTERACTIVE
  job_name_pfx: LMI
  layout:
    ppn: 4
    smear:
      nodes: 16
      geom: [2,2,4,4]
    contract:
      ppn: 1
      nodes: 8
      geom: [1,2,2,2]
    grid:
      nodes: 216
      geom: [8, 6, 6, 9]
      
# Template and I/O file name keys
job_setup:
  smear: 
    run: milc.PYFM_WORKSPACE_SCHEDULER
    job_type: smear
    tasks:
      unsmeared_file: "lat/v5/l{ens}{series}.{cfg}" # Location of unsmeared file
      node_geometry: "2 2 4 4"
    io: links
    wall_time: "3:00:00"
  contract:
    run: contract.PYFM_WORKSPACE_SCHEDULER
    job_type: contract
    tasks:
      diagrams:
      - pion_local
      - vec_local
      - vec_onelink
      - pion_local_hms
      - vec_local_hms
    io: contract
    wall_time: "8:00:00"
  grid: 
    run: grid.PYFM_WORKSPACE_SCHEDULER
    io: 'grid-eig-lma-meson-e{eigs}-n{noise}'
    wall_time: "24:00:00"
    tasks:
      epack:
        load: false
        save_evals: true
      meson:
        gamma:
        - pion_local
        - vec_local
        - vec_onelink
        mass:
        - 'l'
      high_modes:
        pion_local:
          mass: 
          - 'l'
          - 'h'
        vec_local:
          mass: 
          - 'l'
          - 'h'
        vec_onelink:
          mass: 
          - 'l'
files:
  fat_links:
    filestem: lat/scidac/fat{ens}{series}.ildg
    good_size: 115964110000
  long_links:
    filestem: lat/scidac/lng{ens}{series}.ildg
    good_size: 115964110000
  gauge_links:
    filestem: lat/scidac/l{ens}{series}.ildg
    good_size: 48922360000
  eig:
    filestem: eigen/eig{ens}nv{eigs}er8_grid_{series}
    good_size: 8153732016768
  eigdir:
    filestem: eigen/eig{ens}nv{eigs}er8_grid_{series}
    good_size: 4076866904
  eval:
    filestem: eigen/eval/eval{ens}nv{eigs}{series}
    good_size: 815
  high_modes:
    filestem: e{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/{dset}/corr_{gamma_label}_{dset}_m{mass}_t{tsource}_{series}
    good_size: 13100
  meson:
    filestem: e{eigs}n{noise}dt{dt}.2024/mesons/m{mass}/mf_{series}
    good_size: 36864000000
  contract:
    filestem: e{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/a2aLL/corr_{gamma_label}_a2aLL_m{mass}_{series}
    good_size: 13100
        
