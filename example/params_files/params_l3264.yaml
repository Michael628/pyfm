shared_params:
  home: /home/mlynch/Dropbox/Workspaces/pyfm/example/workspace/work-dir/
  mass:
    u: 0.001524
    l: 0.002426
    d: 0.003328
  logging_level: DEBUG
  ens: 3264f211b580m002426m06730m8447
  space: 32
  time: 64
  runid: LMI-RW-series-{series}-{eigs}-eigs-{noise}-noise
  dt: 1
  noise: 1
  lattice:
  - 32
  - 32
  - 32
  - 64
  eigs: 3000
contract_params:
  hardware: cpu
  diagram_params:
    pion_local_u_l:
      gamma_label: pion_local
      symmetric: true
      contraction_type: two_point
      mesons:
      - file: meson
        mass_original: l
        mass_updated: u
        evalfile: eval
      - file: meson
        mass: l
      gammas:
      - G5_G5
      eig_range:
        min: 0
        max: 6000
      outfile: contract
    vec_local_u:
      gamma_label: vec_local
      symmetric: true
      contraction_type: two_point
      mesons:
        file: meson
        mass_original: l
        mass_updated: u
        evalfile: eval
      gammas:
      - GX_GX
      - GY_GY
      - GZ_GZ
      eig_range:
        min: 0
        max: 6000
      outfile: contract
hadrons_params:
  tstart: 0
  tstop: 63
  sourceeigs: 3000
  lanczos:
    alpha: 0.009
    beta: 24
    npoly: 81
    nstop: 3000
    nk: 3030
    nm: 4600
    residual: 1.0e-08
  residual: 1.0e-08
  blocksize: 500
  overwrite: false
nanny:
  todo_file: todo
  max_cases: 1
  max_queue: 200
  wait: 5
  check_interval: 30
submit:
  scheduler: PBS
  job_name_pfx: LMI
  layout:
    ppn: 4
    smear:
      ppn: 1
      nodes: 1
      geom:
      - 1
      - 1
      - 1
      - 1
    contract:
      ppn: 1
      nodes: 1
      geom:
      - 1
      - 1
      - 1
      - 1
    hadrons:
      nodes: 3
      geom:
      - 1
      - 2
      - 2
      - 2
job_setup:
  smear:
    run: smear.pbs
    job_type: smear
    tasks:
      unsmeared_file: lat/v5/l{ens}{series}.{cfg}
      node_geometry: 1 1 1 1
    io: smear
    wall_time: '1:00:00'
  contract:
    run: contract.pbs
    job_type: contract
    tasks:
      diagrams:
      - pion_local_u_l
      - vec_local_u
    io: contract-e{eigs}-n{noise}
    wall_time: '1:00:00'
  hadrons:
    run: hadrons.pbs
    io: lma-e{eigs}-n{noise}
    wall_time: '1:00:00'
    job_type: hadrons
    task_type: lmi
    tasks:
      epack:
        load: false
        save_evals: true
        save_eigs: true
      meson:
        gamma:
        - pion_local
        - vec_local
        mass:
        - l
      high_modes:
        pion_local:
          mass:
          - l
          - u
        vec_local:
          mass:
          - l
          - u
files:
  fat_links:
    filestem: lat/scidac/fat{ens}{series}.ildg
    good_size: -1
  long_links:
    filestem: lat/scidac/lng{ens}{series}.ildg
    good_size: -1
  gauge_links:
    filestem: lat/scidac/l{ens}{series}.ildg
    good_size: -1
  eig:
    filestem: eigen/eig{ens}nv{eigs}{series}
    good_size: -1
  eigdir:
    filestem: eigen/eig{ens}nv{eigs}{series}
    good_size: -1
  eval:
    filestem: eigen/eval/eval{ens}nv{eigs}{series}
    good_size: -1
  high_modes:
    filestem: e{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/{dset}/corr_{gamma_label}_{dset}_m{mass}_t{tsource}_{series}
    good_size: -1
  meson:
    filestem: e{eigs}n{noise}dt{dt}/mesons/m{mass}/mf_{series}
    good_size: -1
  contract:
    filestem: e{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/a2aLL/corr_{gamma_label}_a2aLL_m{mass}_{series}
    good_size: -1
