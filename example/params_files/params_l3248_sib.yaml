# Parameters for the connected strong-isospin-breaking (SIB) HVP three-point
# calculation, V(t1)·S(t2)·V(t3), on the l3248 ensemble.
#
# Follow-on to params_l3248.yaml: the gauge links (ILDG) and the 1000-eig
# eigenpack + evals are produced there and loaded here from the same `files:`
# paths. Two steps:
#   sib_mf       -> hadrons_sib_mf: split-noise SIB meson-field blocks + tabs
#   contract_sib -> contract_sib:   the eight L/H junction terms per (gamma, mass)
# then `aggregate` normalizes the terms by world count and sums them into C3.
shared_params:
  home: PYFM_WORKSPACE_TOPDIR/l{ens} # Location of work directory
  mass:
    u: 0.001524
    l: 0.002426
    d: 0.003328
  logging_level: DEBUG
  ens: '3248f211b580m002426m06730m8447'
  space: 32
  time: 48
  runid: "SIB-series-{series}-{eigs}-eigs-{noise}-noise"
  eigs: 1000 # must match the eigenpack written by params_l3248.yaml
  lattice: [32, 32, 32, 48]

hadrons_params:
  overwrite: false # resume: only missing/undersized block and tab files are recomputed

contract_params:
  hardware: "cpu"
  diagram_params:
    # Outer vector current V at t1 and t3; the scalar insertion S at t2 is
    # always read from the producer's scalar_local blocks. Correlator masses
    # must be a subset of the producer's sib.operations.mass (the lh/nh
    # blocks only exist per producer mass).
    hvp_vl:
      contraction_type: sib
      operations:
        gamma:
          - vec_local
        mass:
          - "l"
          - "u"
          - "d"
      defl_mass: l # must match sib_mf's defl_mass
      blocks: sib_meson_blocks # the producer's own file labels (see 'files:')
      tab: sib_meson_tab
      evalfile: eval
      outfile: contract_sib
    hvp_vo:
      contraction_type: sib
      operations:
        gamma:
          - vec_onelink
        mass:
          - "l"
          - "u"
          - "d"
      defl_mass: l
      blocks: sib_meson_blocks
      tab: sib_meson_tab
      evalfile: eval
      outfile: contract_sib

nanny:
  todo_file: todo # Filename for listing jobs to be completed for each configuration
  max_queue: 200 # Will not submit more jobs if max_queue jobs are in the queue
  wait: 5 # Wait interval between job submissions
  check_interval: 30 # Wait interval between checks for job completion

submit:
  scheduler: PYFM_WORKSPACE_SCHEDULER
  # scheduler: INTERACTIVE
  job_name_pfx: SIB
  resources:
    ppn: 4 # Number of processes per node
    max_cases: 1
    sib_mf: # TODO: tune for 32^3x48 (eigenpack + 4 worlds x 144-column h solves)
      nodes: 1
      geom: [1, 1, 2, 2] # Product should equal nodes*ppn
    contract_sib: # TODO: tune
      ppn: 1
      nodes: 1
      geom: [1, 1, 1, 1]

job_setup:
  sib_mf:
    run: grid.PYFM_WORKSPACE_SCHEDULER
    io: "sib-mf-e{eigs}-n{noise}"
    wall_time: "12:00:00" # TODO: tune
    job_type: hadrons
    task_type: sib_mf
    params:
      # Number of independent noise worlds N. contract_sib needs N >= 2, and
      # N >= 3 for the nnn term (pairwise-distinct world triples) to
      # contribute. Per mass: N h solves, N^2 nh blocks per family.
      noise: 4
    tasks:
      gauge:
        action_type: load # thin + fat/long ILDG links from params_l3248.yaml
      epack:
        load: true # eigenpack from params_l3248.yaml
        save_evals: true # contract_sib reads the evals to reweight to other masses
        save_eigs: false
      sib:
        operations:
          gamma:
            - scalar_local # required: the S insertion
            - vec_local
            - vec_onelink # one-link: uses the gauge_apbc shift gauge
          mass: # h solves and lh/nh blocks run per mass
            - "l"
            - "u"
            - "d"
        defl_mass: l # the single eigenpack shift all low-mode blocks build from
        solver:
          solver: mpcg
          residual: 1e-8
        output:
          file: sib_meson_blocks
          tab: sib_meson_tab
          split_noise: true # required by contract_sib (per-world files)
  contract_sib:
    run: contract.PYFM_WORKSPACE_SCHEDULER
    job_type: contract
    task_type: sib
    params:
      noise: 4 # must match sib_mf's noise
    tasks:
      diagrams:
        - hvp_vl
        - hvp_vo
    io: "contract-sib-e{eigs}-n{noise}"
    wall_time: "4:00:00" # TODO: tune

files: # labels and corresponding locations of all input and output files used in the jobs above
  fat_links:
    filestem: lat/scidac/fat{ens}{series}.ildg
    good_size: 905900000
  long_links:
    filestem: lat/scidac/lng{ens}{series}.ildg
    good_size: 905900000
  ildg_links:
    filestem: lat/scidac/l{ens}{series}.ildg
    good_size: 452900000
  eig:
    filestem: eigen/eig{ens}nv{eigs}{series}
    good_size: 37751000000
  eigdir:
    filestem: eigen/eig{ens}nv{eigs}{series}
    good_size: 4076866904
  eval:
    filestem: eigen/eval/eval{ens}nv{eigs}{series}
    good_size: 11000
  # One label serves both steps. {leg_pair} in ll/nl/lh/nh; {mass} renders
  # '' (ll, nl) or '_m<label>' (lh, nh); {n_index}/{hp_index} render '_n<k>'
  # world suffixes. good_size is the smallest block: nh, complex64
  # [48, 3, 144] = 165,888 B (ll is [48, 2000, 2000] = 1.5 GB).
  sib_meson_blocks:
    filestem: PYFM_WORKSPACE_DATASUBDIRe{eigs}n{noise}/sib/{leg_pair}{mass}_{series}{n_index}{hp_index}
    good_size: 160000
  # Per-world <l|eta> overlap table, complex64 [48, 2000, 3] = 2.3 MB.
  sib_meson_tab:
    filestem: PYFM_WORKSPACE_DATASUBDIRe{eigs}n{noise}/sib/tab_{series}{n_index}
    good_size: 2200000
  # One file per (gamma, mass) holding all eight terms, each [48, 48, 48]
  # complex128 (>= 14.2 MB of values).
  contract_sib:
    filestem: PYFM_WORKSPACE_DATASUBDIRe{eigs}n{noise}/correlators/sib3pt/m{mass}/{gamma}/c3_{gamma}_m{mass}_{series}
    good_size: 14000000
