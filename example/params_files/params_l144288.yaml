#Parameters for LMI running
shared_params:
  home: PYFM_WORKSPACE_TOPDIR/l{ens} # Location of work directory
  mass:
    l: 0.000569
  logging_level: DEBUG
  ens: "144288f211b700m000569m01555m1827"
  lattice: [144, 144, 144, 288]
  space: 144
  time: 288
  runid: "LMI-RW-series-{series}-{eigs}-eigs-{noise}-noise"
  dt: 2 # spacing between source time slices
  noise: 1 # leave this as 1
  eigs: 4000
  sourceeigs: 4000
  tstart: 0 # first source time slice
  tstop: 287 # tstop = time - 1
  dt: 2 # spacing between source time slices
  noise: 1 # leave this as 1
  eigs: 4000
  sourceeigs: 4000
  lanczos:
    alpha: 0.00085
    beta: 24
    npoly: 401
    nstop: 4000
    nk: 4050
    nm: 4900
    residual: 1e-8 # parameter for lanczos eigensolver
  residual: 1e-8
  blocksize: 500
  overwrite: false # skip CG solves if correlator already exists

contract_params:
  hardware: "cpu"
  # logging_level: 'DEBUG'
  diagram_params:
    pion_local:
      gamma_label: pion_local
      symmetric: true
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "G5_G5"
      eig_range:
        min: 0
        max: 8000
      outfile: contract_legacy
    vec_local:
      gamma_label: vec_local
      symmetric: true
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "GX_GX"
        - "GY_GY"
        - "GZ_GZ"
      eig_range:
        min: 0
        max: 8000
      outfile: contract_legacy
    vec_onelink:
      gamma_label: vec_onelink
      symmetric: true
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "GX_G1"
        - "GY_G1"
        - "GZ_G1"
      eig_range:
        min: 0
        max: 8000
      outfile: contract_legacy
nanny:
  todo_file: todo
  # todo_file: todo_checkGhms
  max_cases: 1
  # max_cases: 10
  # max_cases: 12
  # max_cases: 6
  max_queue: 200
  wait: 5
  check_interval: 30

submit:
  scheduler: PYFM_WORKSPACE_SCHEDULER
  job_name_pfx: LMI
  layout:
    ppn: 12
    smear:
      nodes: 16
      geom: [4, 4, 2, 4]
    noacc:
      nodes: 192
      geom: [8, 6, 6, 8]
    irl:
      nodes: 243
      geom: [9, 6, 6, 9]
      # nodes: 192
      # geom: [8, 6, 6, 8]
      # nodes: 216
      # geom: [8, 6, 6, 9]
    benchmark:
      # nodes: 144
      # geom: [6, 6, 6, 8]
      # nodes: 162
      # geom: [6, 6, 6, 9]
      nodes: 192
      geom: [8, 6, 6, 8]
      # nodes: 216
      # geom: [8, 6, 6, 9]
      # nodes: 256
      # geom: [6, 8, 8, 8]
    test:
      nodes: 162
      geom: [6, 6, 6, 9]
    grid:
      # nodes: 144
      # geom: [6, 6, 6, 8]
      # nodes: 162
      # geom: [6, 6, 6, 9]
      # nodes: 192
      # geom: [8, 6, 6, 8]
      # nodes: 216
      # geom: [8, 6, 6, 9]
      nodes: 256
      geom: [6, 8, 8, 8]
    contract:
      ppn: 1
      nodes: 2
      geom: [1, 1, 1, 2]

# Template and I/O file name keys
job_setup:
  smear:
    run: example.pbs
    job_type: smear
    tasks:
      unsmeared_file: 'lat/v5/l{ens}{series}.{cfg}'
      node_geometry: "4 4 2 4"
    io: links
    wall_time: "2:00:00"
  contract:
    run: example.pbs
    job_type: contract
    tasks:
      diagrams:
        - pion_local
        - vec_local
        - vec_onelink
    io: "contract-e{eigs}-n{noise}"
    wall_time: "3:00:00"
  noacc:
    run: example.pbs
    io: "grid-noacc-irl-{nodes}nodes"
    # wall_time: "12:00:00"
    wall_time: "03:00:00"
    job_type: grid
    node_minimum: 256
    params:
      nodes: 192
    tasks:
      epack:
        load: false
        save_evals: true
        save_eigs: false
        multifile: false
  irl:
    run: example.pbs
    io: "grid-irl-{nodes}nodes"
    # wall_time: "12:00:00"
    wall_time: "03:00:00"
    job_type: grid
    node_minimum: 256
    params:
      nodes: 243
    tasks:
      epack:
        load: false
        save_evals: true
        save_eigs: false
        multifile: false
  benchmark:
    run: example.pbs
    io: "benchmark"
    wall_time: "00:20:00"
    job_type: grid
    tasks:
      nothing: 'done'
  test:
    run: example.pbs
    io: "test-e{eigs}-n{noise}"
    wall_time: "12:00:00"
    # wall_time: "00:20:00"
    job_type: grid
    tasks:
      epack:
        load: true
        save_evals: false
        save_eigs: false
        multifile: false
      high_modes:
        gamma:
          - pion_local
          - vec_local
          - vec_onelink
        mass:
          - "l"
      meson:
        gamma:
          - pion_local
          - vec_local
          - vec_onelink
        mass:
          - "l"
  grid:
    run: example.pbs
    io: "grid-lma-e{eigs}-n{noise}"
    wall_time: "12:00:00"
    # wall_time: "00:20:00"
    job_type: grid
    tasks:
      epack:
        load: false
        save_evals: true
        save_eigs: false
        multifile: false
      high_modes:
        gamma:
          - pion_local
          - vec_local
          - vec_onelink
        mass:
          - "l"
      meson:
        gamma:
          - pion_local
          - vec_local
          - vec_onelink
        mass:
          - "l"

