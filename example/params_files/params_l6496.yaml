# Parameters for LMI running
submit_params:
  # logging_level: DEBUG
  ens: '6496f211b630m001326m03636m4313'
  time: 96

contract_params:
  hardware: 'cpu'
  # logging_level: 'DEBUG'
  diagram_params:
    pion_local_l:
      gamma_label: pion_local
      symmetric: True
      contraction_type: conn_2pt
      mesonfiles: 'meson_contract_ll'
      gammas:
      - 'G5_G5'
      low_label: e2000
      low_max: 4000
      mass: '001326'
      outfile: contract
    pion_local_h:
      gamma_label: pion_local
      symmetric: True
      contraction_type: conn_2pt
      mesonfiles: 'meson_contract_ll'
      gammas:
      - 'G5_G5'
      low_label: e2000
      low_max: 4000
      meson_mass: '001326'
      mass: '000514'
      outfile: contract
    vec_local_l:
      gamma_label: vec_local
      symmetric: True
      contraction_type: conn_2pt
      mesonfiles: 'meson_contract_ll'
      gammas:
      - 'GX_GX'
      - 'GY_GY'
      - 'GZ_GZ'
      low_label: e2000
      low_max: 4000
      mass: '001326'
      outfile: contract
    vec_local_h:
      gamma_label: vec_local
      symmetric: True
      contraction_type: conn_2pt
      mesonfiles: 'meson_contract_ll'
      gammas:
      - 'GX_GX'
      - 'GY_GY'
      - 'GZ_GZ'
      low_label: e2000
      low_max: 4000
      meson_mass: '001326'
      mass: '000514'
      outfile: contract
    vec_onelink_l:
      gamma_label: vec_onelink
      symmetric: True
      contraction_type: conn_2pt
      mesonfiles: 'meson_contract_ll'
      gammas:
      - 'GX_G1'
      - 'GY_G1'
      - 'GZ_G1'
      low_label: e2000
      low_max: 4000
      mass: '001326'
      outfile: contract

smear_params:
  space: 96
  node_geometry: "1 1 4 4"

hadrons_params:
  mass:
    l: 0.001326
    d: 0.001802
    h: 0.000514
  tstart: 0
  tstop: 63
  dt: 1
  noise: 1
  eigs: 2000
  sourceeigs: 2000
  alpha: 0.006
  beta: 24
  npoly: 301
  nstop: 2000
  nk: 2030
  nm: 2700
  cg_residual: 1e-8
  eigresid: 1e-8
  blocksize: 500
  overwrite_sources: False
  run_id: 'LMI-RW-series-{series}-{eigs}-eigs-{noise}-noise'

precess:    # (cfg - cfg0)/dcfg*tstep % dt
  loose:
    cfg0: 18
    dcfg: 48
    tstep: 4
  fine:
    cfg0: 18
    dcfg: 48
    tstep: 3
    nt: 96 # must match lattice dimension

nanny:
  todo_file: todo
  # todo_file: todo_checkGhms
  max_cases: 1
  max_queue: 200
  wait:     5
  check_interval: 30

submit:
  scheduler: SLURM
  # scheduler: INTERACTIVE
  job_name_pfx: LMI
  layout:
    ppn: 4
    smear:
      nodes: 1
      geom: [1,1,2,2]
    contract:
      ppn: 1
      nodes: 1
      geom: [1,1,1,1]
    hadrons:
      nodes: 16
      geom: [2,4,2,4] # Product should equal nodes*ppn

# Template and I/O file name keys
job_setup:
  smear: 
    run: smear.slurm
    job_type: smear
    tasks:
      unsmeared_file: '/pscratch/sd/d/dclarke/l96192f211b672m0008m022m260/lat/v5/l{ens}{series}.{cfg}'
      node_geometry: "1 1 2 2"
    io: links
    wall_time: "3:00:00"
  contract:
    run: contract.slurm
    job_type: contract
    tasks:
      diagrams:
      - pion_local_l
      - pion_local_h
      - vec_local_l
      - vec_local_h
      - vec_onelink_l
    io: contract
    wall_time: "8:00:00"
  hadrons: 
    run: hadrons.slurm
    io: 'eig-lma-meson-e{eigs}-n{noise}'
    wall_time: "24:00:00"
    tasks:
      epack:
        load: false
        save_evals: true
      meson:
        gamma:
        - local
        - onelink
        mass:
        - 'l'
      high_modes:
        pion_local:
          mass:
          - 'l'
          - 'h'
        vec_local:
          mass:
          - 'l'
          - 'h'
        vec_onelink:
          mass:
          - 'l'

files:
  home: /pscratch/sd/d/dclarke/l96192f211b672m0008m022m260
  fat_links:
    filestem: lat/scidac/fat{ens}{series}.ildg
    good_size: 115964110000
  long_links:
    filestem: lat/scidac/lng{ens}{series}.ildg
    good_size: 115964110000
  gauge_links:
    filestem: lat/scidac/l{ens}{series}.ildg
    good_size: 48922360000
  eig:
    filestem: eigen/eig{ens}nv{eigs}er8_grid_{series}
    good_size: 8153732016768
  eigdir:
    filestem: eigen/eig{ens}nv{eigs}er8_grid_{series}
    good_size: 4076866904
  eval:
    filestem: eigen/eval/eval{ens}nv{eigs}{series}
    good_size: 815
  high_modes:
    filestem: e{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/{dset}/corr_{gamma_label}_{dset}_m{mass}_t{tsource}_{series}
    good_size: 13100
  meson_contract_ll:
    filestem: e{eigs}n{noise}dt{dt}.2024/mesons/m{meson_mass}/mf_{series}
    good_size: 36864000000
  meson_ll:
    filestem: e{eigs}n{noise}dt{dt}.2024/mesons/m{mass}/mf_{series}
    good_size: 36864000000
  contract:
    filestem: e{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/a2aLL/corr_{gamma_label}_a2aLL_m{mass}_{series}
    good_size: 13100


