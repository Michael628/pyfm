# Parameters for LMI running
submit_params:
  home: PYFM_WORKSPACE_TOPDIR/l{ens} # Location of work directory
  # logging_level: DEBUG
  ens: '6496f211b630m001326m03636m4313'
  time: 96
  lattice: [64, 64, 64, 96]

contract_params:
  hardware: "cpu"
  diagram_params:
    pion_local_u:
      gamma_label: pion_local
      symmetric: True
      contraction_type: two_point
      mesons:
        - file: "meson" # Label given to location of meson field files (see 'files:' section below)
          mass_original: "l" # Mass used in creating meson field file
          mass_updated: "u" # Label for desired mass (from mass: list above)
          evalfile: 'eval' # Label given to location of eigenvalue files (see 'files:' section below)
        - file: "meson" # (Optional) second meson field to contract in 2pt function. If missing, assumes same as first
          mass_original: "l"
          mass_updated: "u"
          evalfile: 'eval'
      gammas:
        - "G5_G5"
      eig_range:
        min: 0
        max: 4000 # Equal to 2 x eigs
      outfile: contract # Label given to output files (see 'files:' section below)
    vec_local_u:
      gamma_label: vec_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass_original: "l"
        mass_updated: "u"
        evalfile: 'eval'
      gammas:
        - "GX_GX"
        - "GY_GY"
        - "GZ_GZ"
      eig_range:
        min: 0
        max: 4000
      outfile: contract
    pion_local_u:
      gamma_label: pion_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass_original: "l"
        mass_updated: "u"
        evalfile: 'eval'
      gammas:
        - "G5_G5"
      eig_range:
        min: 0
        max: 4000
      outfile: contract
    pion_local_d:
      gamma_label: pion_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass_original: "l"
        mass_updated: "d"
        evalfile: "eval"
      gammas:
        - "G5_G5"
      eig_range:
        min: 0
        max: 4000
      outfile: contract
    vec_local_d:
      gamma_label: vec_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass_original: "l"
        mass_updated: "d"
        evalfile: 'eval'
      gammas:
        - "GX_GX"
        - "GY_GY"
        - "GZ_GZ"
      eig_range:
        min: 0
        max: 4000
      outfile: contract
    pion_local_l:
      gamma_label: pion_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "G5_G5"
      eig_range:
        min: 0
        max: 4000
      outfile: contract
    vec_local_l:
      gamma_label: vec_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "GX_GX"
        - "GY_GY"
        - "GZ_GZ"
      eig_range:
        min: 0
        max: 4000
      outfile: contract
    vec_onelink_l:
      gamma_label: vec_onelink
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "GX_G1"
        - "GY_G1"
        - "GZ_G1"
      eig_range:
        min: 0
        max: 4000
      outfile: contract

smear_params:
  space: 96
  node_geometry: "1 1 4 4"

hadrons_params:
  mass:
    l: 0.001326
    d: 0.001802
    h: 0.000514
  tstart: 0
  tstop: 63
  dt: 1
  noise: 1
  eigs: 2000
  sourceeigs: 2000
  lanczos:
    alpha: 0.006
    beta: 24
    npoly: 301
    nstop: 2000
    nk: 2030
    nm: 2700
    residual: 1e-8
  residual: 1e-8
  blocksize: 500
  overwrite: False
  runid: 'LMI-RW-series-{series}-{eigs}-eigs-{noise}-noise'

nanny:
  todo_file: todo
  max_queue: 200
  wait:     5
  check_interval: 30

submit:
  scheduler: PYFM_WORKSPACE_SCHEDULER
  # scheduler: INTERACTIVE
  job_name_pfx: LMI
  resources:
    ppn: 4
    max_cases: 1 # Bundle up to N jobs together (global default; per-step override below)
    smear:
      nodes: 1
      geom: [1,1,2,2]
    contract:
      ppn: 1
      nodes: 1
      geom: [1,1,1,1]
    hadrons:
      nodes: 16
      geom: [2,4,2,4] # Product should equal nodes*ppn

# Template and I/O file name keys
job_setup:
  smear: 
    run: milc.PYFM_WORKSPACE_SCHEDULER
    job_type: smear
    tasks:
      unsmeared_file: "lat/v5/l{ens}{series}.{cfg}" # Location of unsmeared file
      node_geometry: "1 1 2 2"
    io: links
    wall_time: "3:00:00"
  contract:
    run: contract.PYFM_WORKSPACE_SCHEDULER
    job_type: contract
    tasks:
      diagrams:
      - pion_local_l
      - pion_local_h
      - vec_local_l
      - vec_local_h
      - vec_onelink_l
    io: contract
    wall_time: "8:00:00"
  hadrons: 
    run: grid.PYFM_WORKSPACE_SCHEDULER
    io: 'eig-lma-meson-e{eigs}-n{noise}'
    wall_time: "24:00:00"
    tasks:
      epack:
        load: false
        save_evals: true
      meson:
        gamma:
        - local
        - vec_onelink
        mass:
        - 'l'
      high_modes:
        pion_local:
          mass:
          - 'l'
        vec_local:
          mass:
          - 'l'
        vec_onelink:
          mass:
          - 'l'

files:
  fat_links:
    filestem: lat/scidac/fat{ens}{series}.ildg
    good_size: 115964110000
  long_links:
    filestem: lat/scidac/lng{ens}{series}.ildg
    good_size: 115964110000
  v5_links:
    filestem: lat/v5/l{ens}{series}
    good_size: 48922360000
  ildg_links:
    filestem: lat/scidac/l{ens}{series}.ildg
    good_size: 48922360000
  eig:
    filestem: eigen/eig{ens}nv{eigs}er8_grid_{series}
    good_size: 8153732016768
  eigdir:
    filestem: eigen/eig{ens}nv{eigs}er8_grid_{series}
    good_size: 4076866904
  eval:
    filestem: eigen/eval/eval{ens}nv{eigs}{series}
    good_size: 815
  high_modes:
    filestem: PYFM_WORKSPACE_DATASUBDIRe{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/{dset}/corr_{gamma_label}_{dset}_m{mass}_t{tsource}_{series}
    good_size: 13100
  meson:
    filestem: PYFM_WORKSPACE_DATASUBDIRe{eigs}n{noise}dt{dt}.2024/mesons/m{mass}/mf_{series}
    good_size: 36864000000
  contract:
    filestem: PYFM_WORKSPACE_DATASUBDIRe{eigs}n{noise}dt{dt}/correlators/m{mass}/{gamma_label}/a2aLL/corr_{gamma_label}_a2aLL_m{mass}_{series}
    good_size: 13100


